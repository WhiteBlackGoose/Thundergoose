# Builds Thundergoose for Ubuntu/Debian (.deb), Fedora (.rpm), Windows (installer) and macOS
# (.dmg, universal). Every push to main builds the packages as workflow artifacts; pushing a
# tag like v0.2.0 also publishes them as a GitHub release.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Ubuntu / Debian (.deb)
    # The oldest supported runner, so the package works on Ubuntu 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output dist/
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          mv dist/*.deb "dist/Thundergoose-${version}-ubuntu-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*.deb

  fedora:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Build dependencies
        run: dnf install -y gcc gcc-c++ git jq fontconfig-devel freetype-devel libxkbcommon-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm --output dist/
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          mv dist/*.rpm "dist/Thundergoose-${version}-fedora-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*.rpm

  windows:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Installer
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";$inno"
          }
          iscc "/DVersion=$version" packaging\windows\thundergoose.iss
          Copy-Item target\release\thundergoose.exe "dist\Thundergoose-$version-windows-x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    name: macOS (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple silicon and Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: App bundle and disk image
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          app=dist/Thundergoose.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/thundergoose" \
            target/aarch64-apple-darwin/release/thundergoose target/x86_64-apple-darwin/release/thundergoose
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=dist/thundergoose.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/thundergoose-1024.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/thundergoose-1024.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/thundergoose.icns"
          # Not notarized: an ad-hoc signature lets it start after "Open" in the Finder menu.
          codesign --force --deep --sign - "$app"
          mkdir -p dist/dmg
          cp -R "$app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Thundergoose -srcfolder dist/dmg -ov -format UDZO "dist/Thundergoose-${version}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, fedora, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

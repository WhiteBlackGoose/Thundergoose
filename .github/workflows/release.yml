# Builds Thundergoose for Ubuntu/Debian (.deb), Fedora (.rpm), Windows (installer) and macOS
# (.dmg, universal). Every push to main builds the packages as workflow artifacts; pushing a
# tag like v0.2.0 also publishes them as a GitHub release.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Ubuntu / Debian (.deb)
    # The oldest supported runner, so the package works on Ubuntu 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb --no-build --output dist/
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="thundergoose") | .version')
          mv dist/*.deb "dist/Thundergoose-${version}-ubuntu-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*.deb

  fedora:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Build dependencies
        run: dnf install -y gcc gcc-c++ git jq python3 fontconfig-devel freetype-devel libxkbcommon-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          cargo install cargo-generate-rpm --locked
          mkdir -p dist
          cargo generate-rpm --output dist/
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="thundergoose") | .version')
          mv dist/*.rpm "dist/Thundergoose-${version}-fedora-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*.rpm

  windows:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Installer
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'thundergoose' }).version
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";$inno"
          }
          iscc "/DVersion=$version" packaging\windows\thundergoose.iss
          Copy-Item target\release\thundergoose.exe "dist\Thundergoose-$version-windows-x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    name: macOS (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple silicon and Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: App bundle and disk image
        run: |
          set -eE
          trap 'echo "::error title=macOS bundle::line $LINENO failed: $BASH_COMMAND"' ERR
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="thundergoose") | .version')
          app=dist/Thundergoose.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/thundergoose" \
            target/aarch64-apple-darwin/release/thundergoose target/x86_64-apple-darwin/release/thundergoose
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=dist/thundergoose.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/thundergoose-1024.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/thundergoose-1024.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/thundergoose.icns"
          # Not notarized: an ad-hoc signature lets it start after "Open" in the Finder menu.
          codesign --force --deep --sign - "$app"
          mkdir -p dist/dmg
          cp -R "$app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          # hdiutil now and then fails with "Resource busy" on the runners; try again.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Thundergoose -srcfolder dist/dmg -ov -format UDZO "dist/Thundergoose-${version}-macos-universal.dmg" && break
            echo "hdiutil failed (attempt $attempt), retrying"
            sleep 10
          done
          test -f "dist/Thundergoose-${version}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # A stable key (repository secrets) lets new versions install over old ones; without
          # one, a throwaway key is made and each build has to be installed fresh.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Thundergoose" -noprompt
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo install cargo-apk --locked
          set -o pipefail
          cd android
          cargo apk build --release 2>&1 | tee ../build.log
      - name: Report build errors
        if: failure()
        run: |
          # Annotations can be read without signing in, unlike the logs.
          grep -E "^(error|warning: unused)|error:|panicked" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=Android build::/' || true
          tail -c 6000 build.log | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=Android build (end of log)::/'
      - name: Collect
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="thundergoose") | .version')
          mkdir -p dist
          cp android/target/release/apk/Thundergoose.apk "dist/Thundergoose-${version}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, fedora, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

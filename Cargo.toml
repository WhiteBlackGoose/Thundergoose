[package]
name = "thundergoose"
version = "1.0.0"
edition = "2021"
description = "An email client that treats mail as conversations with people"
license = "MIT"
authors = ["WhiteBlackGoose"]
repository = "https://github.com/WhiteBlackGoose/Thundergoose"
readme = "README.md"

[lib]
name = "thundergoose"
path = "src/lib.rs"

[[bin]]
name = "thundergoose"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"
rustls-connector = { version = "0.19", default-features = false, features = ["native-certs", "webpki-roots-certs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = "0.3"
chrono = "0.4"
html-escape = "0.2"
blitz-html = "0.3.0-beta.4"
blitz-dom = { version = "0.3.0-beta.4", features = ["floats"] }
blitz-paint = "0.3.0-beta.4"
blitz-traits = "0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }

# The desktop: windows through winit, desktop notifications, file dialogs, the clipboard.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "accessibility"] }
rfd = "0.15"
open = "5"
notify-rust = "4"
arboard = { version = "3", features = ["wayland-data-control"] }
directories = "6"

# Android: Slint's activity backend; the rest goes through the Java framework.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-android-activity-06", "renderer-software", "compat-1-2"] }
jni = "0.21"
ndk-context = "0.1"

[package.metadata.deb]
maintainer = "WhiteBlackGoose"
section = "mail"
extended-description = "Thundergoose shows email as conversations with people: every mail between you and a person or group, both directions, across all your accounts."
# Wayland, X11, xkbcommon and GL are loaded at runtime.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-cursor0, libwayland-egl1, libegl1, libgl1, libx11-6, libxcursor1, libxrandr2, libxi6"
assets = [
    ["target/release/thundergoose", "usr/bin/", "755"],
    ["packaging/thundergoose.desktop", "usr/share/applications/", "644"],
    ["packaging/thundergoose.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/thundergoose-256.png", "usr/share/icons/hicolor/256x256/apps/thundergoose.png", "644"],
    ["README.md", "usr/share/doc/thundergoose/", "644"],
]

[package.metadata.generate-rpm]
summary = "Email as conversations with people"
assets = [
    { source = "target/release/thundergoose", dest = "/usr/bin/thundergoose", mode = "755" },
    { source = "packaging/thundergoose.desktop", dest = "/usr/share/applications/thundergoose.desktop", mode = "644" },
    { source = "packaging/thundergoose.svg", dest = "/usr/share/icons/hicolor/scalable/apps/thundergoose.svg", mode = "644" },
    { source = "packaging/thundergoose-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/thundergoose.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/thundergoose/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"
libwayland-cursor = "*"
libwayland-egl = "*"
libglvnd-egl = "*"
libX11 = "*"
libXcursor = "*"
libXrandr = "*"
libXi = "*"

[build-dependencies]
slint-build = "1.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
